<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Vespera FX</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>

<body>

  <header>
    <div class="logo">Vespera<span>FX</span></div>
    <nav>
      <a href="categories.html" class="active">Categories</a>
      <a href="index.html">Latest</a>
      <a href="#">Telegram</a>
    </nav>
  </header>

  <section class="page-heading">
    <h1>Browse by category</h1>
    <p>Pick a mood. Each one opens straight into its own gallery.</p>
  </section>

  <!-- This is now a picker: 3 tiles, 3 clicks, no scrolling through everything at once. -->
  <section class="category-grid">

    <a href="category-abstract.html" class="category-tile">
      <img src="images/glass-orb.png" alt="Abstract category cover">
      <div class="category-tile-text">
        <h3>Abstract</h3>
        <span>5 wallpapers</span>
      </div>
    </a>

    <a href="category-landscape.html" class="category-tile">
      <img src="images/ocean-horizon.png" alt="Landscape category cover">
      <div class="category-tile-text">
        <h3>Landscape</h3>
        <span>7 wallpapers</span>
      </div>
    </a>

    <a href="category-architecture.html" class="category-tile">
      <img src="images/spiral-staircase.png" alt="Architecture category cover">
      <div class="category-tile-text">
        <h3>Architecture</h3>
        <span>5 wallpapers</span>
      </div>
    </a>

    <a href="category-nightsky.html" class="category-tile">
      <img src="images/crescent-moon.png" alt="Night Sky category cover">
      <div class="category-tile-text">
        <h3>Night Sky</h3>
        <span>3 wallpapers</span>
      </div>
    </a>

  </section>

</body>
</html>
