<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architecture — Vespera FX</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <div class="logo">Vespera<span>FX</span></div>
    <nav>
      <a href="categories.html" class="active">Categories</a>
      <a href="index.html">Latest</a>
      <a href="#">Telegram</a>
    </nav>
  </header>

  <div class="breadcrumb">
    <a href="categories.html">&larr; All Categories</a>
  </div>

  <section class="page-heading">
    <h1>Architecture</h1>
    <p>Structure, lines, and man-made geometry.</p>
  </section>

  <section class="grid">
    <div class="card" data-resolution="1152 × 896" data-size="1.0 MB">
      <img src="images/spiral-staircase.png" alt="Spiral staircase viewed from above">
      <div class="label">Descent</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.2 MB">
      <img src="images/water-tower.png" alt="Rooftop water tower silhouette against dusk sky">
      <div class="label">Water Tower</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.2 MB">
      <img src="images/hallway.png" alt="Empty modern hallway with one light source">
      <div class="label">Threshold</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.2 MB">
      <img src="images/arched-doorway-flat.png" alt="Arched doorway, flat graphic style">
      <div class="label">Terracotta Arch</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.2 MB">
      <img src="images/arched-doorway.png" alt="Arched doorway with warm light, photographic style">
      <div class="label">Amber Doorway</div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <div class="lightbox-info">
      <h3 id="lightboxName"></h3>
      <div class="meta" id="lightboxMeta"></div>
    </div>
    <a class="lightbox-download" id="lightboxDownload" href="" download>Download Wallpaper</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
