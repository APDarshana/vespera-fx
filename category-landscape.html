    <div class="card" data-resolution="1152 × 896" data-size="46 KB">
      <img src="images/thumbs/ocean-horizon.jpg" data-full="images/ocean-horizon.jpg" alt="Calm ocean horizon with moon reflection" loading="lazy">
      <div class="label">Silent Tide</div>
    </div>
    <div class="card" data-resolution="1152 × 896" data-size="28 KB">
      <img src="images/thumbs/city-skyline.jpg" data-full="images/city-skyline.jpg" alt="Distant city skyline silhouette at sunset" loading="lazy">
      <div class="label">Amber Line</div>
    </div>
    <div class="card" data-resolution="504 × 896" data-size="0.4 MB">
      <img src="images/thumbs/sand-dune.jpg" data-full="images/sand-dune.jpg" alt="Single sand dune lit at night" loading="lazy">

    </div>

    </div>
    <div class="card" data-resolution="1008 × 1792" data-size="2.1 MB">
      <img src="images/thumbs/frozen-lake.jpg" data-full="images/frozen-lake.jpg" alt="Frozen lake with cracked ice texture" loading="lazy">
      <div class="label">Fracture</div>
    </div>
    <div class="card" data-resolution="720 × 1280" data-size="0.4 MB">
      <img src="images/thumbs/lighthouse.jpg" data-full="images/lighthouse.jpg" alt="Lone lighthouse silhouette on a cliff at night" loading="lazy">
      <div class="label">Lighthouse</div>
    </div>
    <div class="card" data-resolution="720 × 1280" data-size="0.3 MB">
