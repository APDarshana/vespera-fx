<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky — Vespera FX</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

  <header>
    <div class="logo">Vespera<span>FX</span></div>
    <nav>
      <a href="categories.html" class="active">Categories</a>
      <a href="index.html">Latest</a>
      <a href="#">Telegram</a>
    </nav>
  </header>

  <div class="breadcrumb">
    <a href="categories.html">&larr; All Categories</a>
  </div>

  <section class="page-heading">
    <h1>Night Sky</h1>
    <p>Moonlight, stars, and quiet dark skies.</p>
  </section>

  <section class="grid">
    <div class="card" data-resolution="768 × 1376" data-size="1.0 MB">
      <img src="images/crescent-moon.png" alt="Crescent moon with soft glow">
      <div class="label">Crescent</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.0 MB">
      <img src="images/star-field.png" alt="Single bright star in a dark star field">
      <div class="label">North Star</div>
    </div>
    <div class="card" data-resolution="768 × 1376" data-size="1.3 MB">
      <img src="images/cloud-layer.png" alt="Thin cloud layer over moonlight">
      <div class="label">Veil</div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <div class="lightbox-info">
      <h3 id="lightboxName"></h3>
      <div class="meta" id="lightboxMeta"></div>
    </div>
    <a class="lightbox-download" id="lightboxDownload" href="" download>Download Wallpaper</a>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
